name: build

on:
  workflow_dispatch:
    inputs:
      build_environment:
        description: Application build environment
        required: false
        type: choice
        default: pre
        options:
          - pre
          - stable
      build_additional_desktops:
        description: Build Mac Apple Silicon, Mac Intel and Linux deb packages
        required: false
        type: boolean
        default: false
      build_signed_android:
        description: Build the production-signed Android package
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FLUTTER_VERSION: '3.44.4'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Test release notes generation
        shell: bash
        run: bash .github/scripts/generate_release_notes_test.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Validate local Flutter packages
        shell: bash
        run: |
          for package in plugins/proxy plugins/wifi_ssid plugins/window_ext plugins/setup; do
            (
              cd "$package"
              flutter pub get
              flutter analyze --no-fatal-infos
            )
          done

      - name: Run local plugin tests
        shell: bash
        run: |
          (
            cd plugins/proxy
            flutter test --reporter expanded
          )
          (
            cd plugins/wifi_ssid
            flutter test --reporter expanded
          )

      - name: Validate setup build tool
        working-directory: plugins/setup/buildkit/build_tool
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Validate Go core wrapper
        working-directory: core
        env:
          CGO_ENABLED: 0
        run: |
          go test .
          go vet .

      - name: Validate Rust components
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo test --manifest-path services/helper/Cargo.toml
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    name: Windows helper test
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

  unsigned-desktop-build:
    name: Unsigned ${{ matrix.platform }} ${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch' && !inputs.build_additional_desktops
    needs: [ test, windows-helper-test ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: windows
            os: windows-2022
            arch: amd64
            target: exe
          - platform: macos
            os: macos-latest
            arch: arm64
            target: dmg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Enable git long paths
        if: matrix.platform == 'windows'
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show Xcode version
        if: matrix.platform == 'macos'
        run: xcodebuild -version

      - name: Install dependencies
        run: |
          flutter --version
          flutter pub get

      - name: Build unsigned package
        run: dart setup.dart ${{ matrix.platform }} --targets ${{ matrix.target }} --env ${{ inputs.build_environment || 'pre' }} -v

      - name: Verify Windows installer and helper
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $versionLine = (Select-String -Path pubspec.yaml -Pattern '^version: (.+)$').Matches[0].Groups[1].Value
          $versionParts = $versionLine -split '\+'
          $expectedVersion = [version]$versionParts[0]
          $expectedBuild = [int]$versionParts[1]
          $installers = @(Get-ChildItem dist -Recurse -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer' }
          $installDir = Join-Path $env:RUNNER_TEMP 'ElephantNetwork-acceptance'
          try {
            $install = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installDir`"") -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
            $appPath = Join-Path $installDir 'ElephantNetwork.exe'
            $info = (Get-Item $appPath).VersionInfo
            if ($info.CompanyName -ne 'com.elephantroute' -or $info.ProductName -ne 'ElephantNetwork') { throw 'Windows storage identity is not isolated' }
            if ($info.FileMajorPart -ne $expectedVersion.Major -or $info.FileMinorPart -ne $expectedVersion.Minor -or $info.FileBuildPart -ne $expectedVersion.Build -or $info.FilePrivatePart -ne $expectedBuild) { throw "Unexpected executable version: $($info.FileVersion)" }
            $helperPath = Join-Path $installDir 'ElephantNetworkHelperService.exe'
            if (!(Test-Path $helperPath)) { throw 'Isolated Windows helper is missing' }
            $manifest = Get-Content (Join-Path $installDir 'manifest.json') -Raw | ConvertFrom-Json
            $coreHash = (Get-FileHash (Join-Path $installDir 'FlClashCore.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($coreHash -ne $manifest.coreSha256) { throw 'Bundled core hash differs from manifest' }
            $helper = Start-Process -FilePath $helperPath -ArgumentList 'install' -Wait -PassThru
            if ($helper.ExitCode -ne 0) { throw "Helper installation failed: $($helper.ExitCode)" }
            $service = Get-Service 'ElephantNetworkHelperService'
            if ($service.Status -ne 'Running') { throw 'Isolated helper service is not running' }
            $service.Dispose()
            $ping = Invoke-WebRequest -Uri "http://127.0.0.1:47891/ping?coreSha256=$coreHash"
            if ($ping.Headers['x-elephant-network-helper-protocol'] -ne '6') { throw 'Unexpected helper protocol' }
            if ($ping.Content.Trim() -ne $helperPath) { throw 'Helper belongs to another installation' }
            Write-Output "Verified Windows $versionLine, isolated storage identity, helper service and core hash"
          } finally {
            $uninstaller = Join-Path $installDir 'unins000.exe'
            if (Test-Path $uninstaller) {
              $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
              if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed: $($uninstall.ExitCode)" }
            }
          }
          if (Get-Service 'ElephantNetworkHelperService' -ErrorAction SilentlyContinue) { throw 'Uninstall left the helper service registered' }

      - name: Read package version
        id: package-version
        shell: bash
        run: |
          version=$(sed -nE 's/^version: ([^+]+).*/\1/p' pubspec.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: ElephantNetwork-${{ steps.package-version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-unsigned
          path: ./dist
          if-no-files-found: error
          overwrite: true

  additional-desktop-build:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    if: github.event_name == 'workflow_dispatch' && inputs.build_additional_desktops
    needs: [ test, windows-helper-test ]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-latest
            arch: arm64
            target: dmg
          - platform: macos
            os: macos-15-intel
            arch: amd64
            target: dmg
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
            target: deb
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libkeybinder-3.0-dev libsecret-1-dev libblkid-dev liblzma-dev xvfb dbus-x11 desktop-file-utils

      - name: Configure Mac architecture
        if: matrix.platform == 'macos'
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          xcodebuild -version
          arch=arm64
          excluded=x86_64
          if [ "$PACKAGE_ARCH" = amd64 ]; then arch=x86_64; excluded=arm64; fi
          config="$RUNNER_TEMP/ElephantNetwork.xcconfig"
          printf 'ARCHS = %s\nONLY_ACTIVE_ARCH = YES\nEXCLUDED_ARCHS = %s\nMACOSX_DEPLOYMENT_TARGET = 12.0\n' "$arch" "$excluded" > "$config"
          echo "XCODE_XCCONFIG_FILE=$config" >> "$GITHUB_ENV"

      - name: Install dependencies and packaging tool
        run: |
          flutter pub get
          dart pub global activate -s git https://github.com/chen08209/flutter_distributor.git --git-ref FlClash --git-path packages/flutter_distributor
          if [ "${{ matrix.platform }}" = macos ]; then npm install -g appdmg; fi

      - name: Build package
        env:
          APP_ENV: ${{ inputs.build_environment || 'pre' }}
        run: flutter_distributor package --platform ${{ matrix.platform }} --targets ${{ matrix.target }} --skip-clean --build-dart-define APP_ENV=${{ inputs.build_environment || 'pre' }} --description ${{ matrix.arch }}

      - name: Verify installed package and Core
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: bash .github/scripts/verify_posix_package.sh

      - name: Read package version
        id: package-version
        run: |
          version=$(sed -nE 's/^version: ([^+]+).*/\1/p' pubspec.yaml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ElephantNetwork-${{ steps.package-version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}-verified
          path: ./dist
          if-no-files-found: error
          overwrite: true

  signed-android-build:
    name: Signed Android
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_signed_android }}
    needs: [ test, windows-helper-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android Signing
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Build signed Android package
        run: dart setup.dart android --arch arm64 --env stable -v

      - name: Upload signed Android package
        uses: actions/upload-artifact@v4
        with:
          name: artifact-android
          path: ./dist
          if-no-files-found: error
          overwrite: true

  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ test, windows-helper-test ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: Windows-2022
            arch: amd64
          - platform: macos
            os: macos-15-intel
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          {
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "storePassword=${{ secrets.STORE_PASSWORD }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        if: startsWith(matrix.platform,'macos')
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup NDK
        if: startsWith(matrix.platform,'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  changelog:
    if: ${{ !contains(github.ref, '-') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/heads/main
      - name: Generate
        run: |
          last_ver=$(grep -m1 '^## ' CHANGELOG.md 2>/dev/null | sed 's/^## //')

          mapfile -t tags < <(git tag --merged HEAD --sort=-creatordate)

          temp="NEW_CHANGELOG.md"
          : > "$temp"

          for i in "${!tags[@]}"; do
              curr="${tags[i]}"
              [[ "$curr" == "$last_ver" ]] && break

              prev="${tags[i+1]}"
              range="${prev:+$prev..}$curr"

              echo -e "## $curr\n" >> "$temp"
              git log --no-merges --pretty=format:"%B" "$range" | \
              awk '!/Update changelog/ && NF {print "- " $0 "\n"}' >> "$temp"
          done
          [ -f CHANGELOG.md ] && cat CHANGELOG.md >> "$temp"
          
          mv "$temp" CHANGELOG.md

      - name: Commit
        run: |
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            echo "Commit pushing"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git commit -m "Update changelog"
            if git push; then
              echo "Push succeeded"
            else
              echo "Push failed"
              exit 1
            fi
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    permissions:
      contents: write
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Generate release.md
        shell: bash
        run: |
          pre_tag=$(
            curl --silent "https://api.github.com/repos/joyefrck/ElephantNetwork/releases/latest" |
              sed -nE 's/.*"tag_name": "([^"]+)".*/\1/p'
          )
          bash .github/scripts/generate_release_notes.sh "$pre_tag" release.md

      - name: Patch release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md

      - name: Generate sha256
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          cd ./dist
          sha256sum ./* > SHA256SUMS

      - name: Release
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: './release.md'
